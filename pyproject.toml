[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pintrace"
version = "1.0.0"
description = "Longitudinal measurement of GitHub Actions SHA pinning around the tj-actions/changed-files compromise"
authors = [{name = "Junjie Chen", email = "junjie_chen@njust.edu.cn"}]
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7", "json5>=0.9,<1", "ijson>=3.4,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
audit = ["pyarrow"]

[tool.setuptools.packages.find]
include = ["pintrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

